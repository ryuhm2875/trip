<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EBF0EF">
<title>나트랑 태교여행 · 10.8–10.12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  /* 밝은 햇빛 아래 폰에서 읽히도록 대비를 크게 올린 팔레트 */
  --bg:#F4F1EA; --card:#FFFFFF; --sunk:#FAF8F3;
  --ink:#14201C;          /* 본문 — 흰 배경 대비 15.8:1 */
  --ink2:#2C3B36;
  --muted:#55655F;        /* 보조 — 대비 6.9:1 (AA 통과) */
  --faint:#7C8C86;        /* 3차 — 대비 4.1:1, 최소 사용 */
  --line:#E2DDD0; --line2:#EFEBE1;
  --sea:#0A5C4E; --sea-bg:#D6EAE3; --sea-line:#8FBFB2;
  --lamp:#9A5B00; --lamp-bg:#FBEBD3; --lamp-line:#DFB574;
  --danger:#9C2A20; --danger-bg:#FBE4E0; --danger-line:#D99B90;
  --book:#6E4A05; --book-bg:#FAEFD5;
  --rest:#245C46; --rest-bg:#DDEDE4;
  --sh-sm:0 1px 2px rgba(20,32,28,.06);
  --sh:0 1px 3px rgba(20,32,28,.07), 0 6px 14px -8px rgba(20,32,28,.18);
  --sh-lg:0 2px 6px rgba(20,32,28,.09), 0 18px 34px -16px rgba(20,32,28,.32);
  --r:16px; --r-sm:12px;
  --body:'Pretendard','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
  --disp:'Gowun Batang',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.6;letter-spacing:-.011em;overscroll-behavior-y:none;
  padding-bottom:calc(134px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
a{color:var(--sea);text-underline-offset:2px}
:focus-visible{outline:2.5px solid var(--sea);outline-offset:2px;border-radius:8px}

/* ─── header ─── */
header{position:sticky;top:0;z-index:30;background:rgba(244,241,234,.97);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1.5px solid var(--line)}
.hwrap{max-width:620px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btitle{min-width:0}
.btitle h1{font-family:var(--disp);font-size:19px;font-weight:700;margin:0;letter-spacing:-.03em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btitle small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.hright{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.focusbtn{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--muted);min-height:36px;box-shadow:var(--sh-sm)}
.focusbtn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.focusbtn .dotmark{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.focusbtn[aria-pressed=true] .dotmark{background:#7FE0C4}
.stamp{text-align:right}
.stamp b{display:block;font-family:var(--disp);font-size:17px;color:var(--sea);line-height:1.15;font-weight:700}
.stamp span{font-size:11px;color:var(--muted);letter-spacing:.02em;font-weight:500}
.stamp.live b{color:var(--danger)}

.daybar{display:flex;gap:7px;overflow-x:auto;padding:12px 0 11px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.daybar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px 8px 12px;display:flex;gap:8px;align-items:center;box-shadow:var(--sh-sm);min-height:42px}
.chip .cn{font-family:var(--disp);font-size:15px;font-weight:700;color:var(--ink)}
.chip .cd{font-size:13px;color:var(--muted);font-weight:500}
.chip .ring{width:17px;height:17px;flex:0 0 auto}
.chip .ring circle{fill:none;stroke-width:3.4}
.chip .ring .bg{stroke:var(--line)} .chip .ring .fg{stroke:var(--sea);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.chip[aria-selected=true]{background:var(--ink);border-color:var(--ink)}
.chip[aria-selected=true] .cn{color:#fff} .chip[aria-selected=true] .cd{color:#B4C7C1}
.chip[aria-selected=true] .ring .bg{stroke:#3B4E49} .chip[aria-selected=true] .ring .fg{stroke:#7FE0C4}
.chip.today{border-color:var(--danger)}
.chip.today .cn::after{content:'●';color:var(--danger);font-size:8px;position:relative;top:-4px;margin-left:4px}

main{padding:18px 16px 8px;max-width:620px;margin:0 auto}

/* ─── shared ─── */
.eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:700}
.sec{margin-bottom:28px}
.sec>h3{font-family:var(--disp);font-size:22px;margin:0 0 5px;font-weight:700;letter-spacing:-.03em}
.sec>p.lead{margin:0 0 15px;font-size:13.5px;color:var(--muted);line-height:1.6}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:10px 16px 18px;line-height:1.7}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sea);transition:width .4s cubic-bezier(.3,.9,.3,1)}
.bar.amber i{background:var(--lamp)}
.bar.over i{background:var(--danger)}

/* ─── home ─── */
.hero{background:linear-gradient(158deg,#123A32,#08221D);color:#EAF3F0;border-radius:20px;padding:20px 19px;box-shadow:var(--sh-lg);margin-bottom:15px}
.hero .eyebrow{color:#8FC0B5}
.hero h2{font-family:var(--disp);font-size:27px;margin:8px 0 4px;color:#fff;font-weight:700;letter-spacing:-.03em;line-height:1.24}
.hero .sub{font-size:13.5px;color:#AACCC5;margin:0;line-height:1.55}
.hero .big{font-family:var(--disp);font-size:44px;color:#FBD996;line-height:1;margin:14px 0 3px;letter-spacing:-.035em;font-weight:700}
.hero .biglab{font-size:13px;color:#A5C6C0;font-weight:500}
.ways{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.way{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;font-size:13px;display:flex;gap:6px;align-items:center;min-height:36px;color:#DCEBE7}
.way b{font-weight:700;color:#fff}
.way.on{background:#FBD996;border-color:#FBD996;color:#22332C} .way.on b{color:#14201C}
.heroacts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.heroacts a,.heroacts button{flex:1 1 auto;min-height:50px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;font-size:14.5px;font-weight:700;text-decoration:none;padding:0 16px}
.heroacts .prim{background:#fff;color:#0C2A24}
.heroacts .ghost{background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.26);color:#EAF3F0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:15px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh-sm)}
.tile .lab{font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:700}
.tile .val{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:-.035em;margin:6px 0 9px;line-height:1;color:var(--ink)}
.tile .val i{font-style:normal;font-size:14px;color:var(--muted);margin-left:3px}
.tile .sub{font-size:12.5px;color:var(--muted);margin-top:8px;display:block;font-weight:500}
.upnext{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden;margin-bottom:15px}
.upnext .uh{padding:14px 15px 11px;border-bottom:1.5px solid var(--line2)}
.upnext .ur{display:flex;gap:12px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line2)}
.upnext .ur:last-child{border-bottom:0}
.upnext .ut{font-family:var(--disp);font-size:14px;color:var(--ink2);width:50px;flex:0 0 auto;font-weight:700}
.upnext .un{flex:1;font-size:14.5px;min-width:0;font-weight:500}
.upnext .um{font-size:12.5px;color:var(--muted);white-space:nowrap;font-weight:600}

/* ─── timeline ─── */
.tl{position:relative;padding-left:44px}
.tl::before{content:'';position:absolute;left:13px;top:12px;bottom:18px;width:3px;background:var(--line);border-radius:3px}
.stop{position:relative;margin-bottom:11px}
.dot{position:absolute;left:-44px;top:13px;width:29px;height:29px;border-radius:50%;background:var(--card);border:2.5px solid var(--line);color:var(--muted);font-family:var(--disp);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
.stop.key .dot{border-color:var(--ink);color:var(--ink)}
.stop.is-now .dot{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 0 0 5px rgba(156,42,32,.16)}
.stop.is-done .dot{background:var(--sea);border-color:var(--sea);color:#fff}
.stop.is-past .dot{opacity:.45}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden}
.stop.is-now .card{border-color:var(--danger);border-width:2px;box-shadow:0 2px 6px rgba(156,42,32,.1),0 14px 28px -16px rgba(156,42,32,.5)}
.stop.is-done .card{opacity:.55}
.stop.is-past .card{opacity:.72}
.stop.is-done .hd .ttl{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--faint)}
.hdrow{display:flex;align-items:stretch}
.hd{flex:1;min-width:0;display:flex;gap:11px;align-items:center;padding:15px 4px 15px 15px;min-height:64px}
.hd .meta{flex:1;min-width:0}
.time{font-family:var(--disp);font-size:14px;color:var(--ink2);letter-spacing:.01em;display:block;margin-bottom:3px;font-weight:700}
.stop.is-now .time{color:var(--danger)}
.hd .ttl{display:block;margin:0;font-size:17px;font-weight:600;letter-spacing:-.028em;line-height:1.35;color:var(--ink)}
.warnmark{color:var(--danger);font-size:14px;margin-left:5px}
.warnmark.book{color:var(--book)}
.hd .cost{font-family:var(--disp);font-size:15px;color:var(--ink);white-space:nowrap;flex:0 0 auto;font-weight:700}
.hd .cost s{display:block;font-size:11.5px;color:var(--muted);text-decoration:none;font-family:var(--body);font-weight:500;margin-top:1px}
.hd .cost.over{color:var(--danger)}
.chev{flex:0 0 auto;width:17px;height:17px;color:var(--muted);transition:transform .22s;margin-right:11px}
.hd[aria-expanded=true] .chev{transform:rotate(180deg)}
.tick{flex:0 0 auto;width:58px;display:flex;align-items:center;justify-content:center;border-left:1.5px solid var(--line2)}
.tick span{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;transition:.16s}
.tick svg{width:15px;height:15px}
.stop.is-done .tick span{background:var(--sea);border-color:var(--sea);color:#fff;animation:pop .28s ease}
@keyframes pop{0%{transform:scale(.65)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
.body{padding:14px 15px 15px;border-top:1.5px solid var(--line2);background:var(--sunk)}
.addr{font-size:13.5px;color:var(--ink2);margin:0 0 11px;display:flex;gap:7px;font-weight:500}
.note{font-size:14.5px;color:var(--ink2);margin:0 0 12px;line-height:1.65}
.alert{border-radius:var(--r-sm);padding:12px 13px;margin:0 0 12px;font-size:14px;line-height:1.6;display:flex;gap:9px;font-weight:500}
.alert .ic{flex:0 0 auto;font-weight:700}
.alert.danger{background:var(--danger-bg);color:var(--danger);border-left:4px solid var(--danger)}
.alert.book{background:var(--book-bg);color:var(--book);border-left:4px solid var(--book)}
.alert.note{background:#EDEFEA;color:var(--ink2);border-left:4px solid var(--faint)}
.menu{border:1.5px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin:0 0 12px;background:#fff}
.menu div{display:flex;justify-content:space-between;gap:14px;font-size:14px;padding:11px 13px;border-bottom:1px solid var(--line2)}
.menu div:last-child{border-bottom:0}
.menu span:first-child{font-weight:500;color:var(--ink)}
.menu span:last-child{color:var(--muted);white-space:nowrap;font-weight:600;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.act{display:inline-flex;gap:6px;align-items:center;justify-content:center;font-size:14px;min-height:48px;padding:0 18px;border-radius:12px;text-decoration:none;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink2);flex:1 1 auto}
.act.sea{border-color:var(--sea);color:var(--sea)}
.act.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.spend{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;flex-wrap:wrap}
.spend label{font-size:13px;color:var(--muted);flex:0 0 auto;font-weight:600}
.spend input{flex:1;min-width:90px;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:16px;background:#fff;min-height:46px;text-align:right;font-weight:600}
.spend .unit{font-size:13px;color:var(--muted);font-weight:600}
.spend .diff{font-size:13px;font-weight:700;white-space:nowrap;flex-basis:100%;text-align:right}
.spend .diff.over{color:var(--danger)} .spend .diff.under{color:var(--sea)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:12px;padding:4px 11px;border-radius:999px;font-weight:700;background:var(--sea-bg);color:var(--sea)}
.tag.rest{background:var(--rest-bg);color:var(--rest)}
.tag.lamp{background:var(--lamp-bg);color:var(--lamp)}
.tag.dark{background:#E4E7E1;color:var(--ink2)}
.tag.danger{background:var(--danger-bg);color:var(--danger)}
.tag.book{background:var(--book-bg);color:var(--book)}

.move{margin:0 0 11px -26px;display:flex;gap:10px;align-items:center}
.move .rail{width:3px;height:34px;background:var(--line);margin-left:13px;flex:0 0 auto;border-radius:3px}
.opts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;box-shadow:var(--sh-sm);min-height:40px;font-weight:500}
.opt b{font-weight:700;color:var(--ink2)}
.opt[aria-pressed=true]{background:var(--lamp-bg);border-color:var(--lamp-line);color:var(--lamp)} .opt[aria-pressed=true] b{color:var(--lamp)}
.opt.free[aria-pressed=true]{background:var(--sea-bg);border-color:var(--sea-line);color:var(--sea)} .opt.free[aria-pressed=true] b{color:var(--sea)}
.movenote{font-size:12.5px;color:var(--muted);font-weight:500}
.haul{margin:0 0 15px -44px;background:linear-gradient(152deg,#123A32,#0A241F);color:#D3E5E0;border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:13px;box-shadow:var(--sh)}
.haul b{color:#fff;font-family:var(--disp);font-size:16px;display:block;font-weight:700;letter-spacing:-.025em;margin-bottom:3px}
.haul span{font-size:12.5px;color:#9EC0B9;font-weight:500}
.haul .amt{font-family:var(--disp);font-size:16px;color:#FBD996;white-space:nowrap;font-weight:700}

/* ─── map ─── */
.mapcard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:15px;margin:22px 0;box-shadow:var(--sh-sm)}
.mapcard h4{margin:0 0 3px;font-size:16px;font-weight:700;letter-spacing:-.025em}
.mapcard p.cap{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
body.focus .mapcard p.cap,body.focus .maphint,body.focus .legend{display:none}

/* ─── prep / lists ─── */
.segs{display:flex;gap:7px;margin-bottom:17px}
.segs button{flex:1;text-align:center;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 0;font-size:14px;color:var(--muted);min-height:48px;box-shadow:var(--sh-sm);font-weight:600}
.segs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.pick{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:11px;box-shadow:var(--sh-sm)}
.pick h4{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-.025em}
.pick p{margin:0 0 13px;font-size:13.5px;color:var(--muted);line-height:1.6}
.picks{display:flex;gap:7px;flex-wrap:wrap}
.pk{border:2px solid var(--line);border-radius:var(--r-sm);padding:11px 15px;font-size:14.5px;background:#fff;color:var(--ink2);line-height:1.35;min-height:52px;box-shadow:var(--sh-sm);font-weight:600;flex:1 1 auto}
.pk small{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:500}
.pk[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.pk[aria-pressed=true] small{color:#B4C7C1}
.bigprog{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:17px;box-shadow:var(--sh)}
.bigprog .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.bigprog .n{font-family:var(--disp);font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.bigprog .n i{font-style:normal;font-size:15px;color:var(--muted);margin-left:4px}
.bigprog .pct{font-family:var(--disp);font-size:18px;color:var(--sea);font-weight:700}
.bigprog .pct.over{color:var(--danger)}
.bigprog .split{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:13px;font-weight:500}
.grouphead{display:flex;align-items:center;gap:10px;margin:22px 0 9px}
.grouphead h4{margin:0;font-size:13px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase;font-weight:700}
.grouphead .gbar{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.grouphead .gbar i{display:block;height:100%;background:var(--sea);border-radius:99px;transition:width .4s}
.grouphead .gn{font-family:var(--disp);font-size:13.5px;color:var(--ink2);font-weight:700}
.list{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm)}
.list>button,.list>div.rowx{display:flex;gap:13px;align-items:center;width:100%;padding:15px;border-bottom:1px solid var(--line2);min-height:62px}
.list>button:last-child,.list>div.rowx:last-child{border-bottom:0}
.box{flex:0 0 auto;width:25px;height:25px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;transition:.16s}
.box svg{width:14px;height:14px}
.list>button[aria-pressed=true] .box{background:var(--sea);border-color:var(--sea);color:#fff;animation:pop .28s ease}
.list>button[aria-pressed=true] .txt{color:var(--faint)}
.list>button[aria-pressed=true] .txt b{text-decoration:line-through;text-decoration-color:var(--faint)}
.txt{font-size:15px;line-height:1.5;flex:1;min-width:0}
.txt b{font-weight:600;color:var(--ink)}
.txt em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55;font-weight:500}
.list>button[aria-pressed=true] .txt b{color:var(--faint)}
.sortrow{display:flex;justify-content:flex-end;margin:-4px 0 11px}
.sortrow button{font-size:13px;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;background:#fff;min-height:42px;font-weight:600}
.sortrow button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ─── 결제 ─── */

const b64e = str => { let x=''; new TextEncoder().encode(str).forEach(c=>x+=String.fromCharCode(c));
  return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const b64d = str => { const x=atob(str.replace(/-/g,'+').replace(/_/g,'/'));
  const b=new Uint8Array(x.length); for(let i=0;i<x.length;i++) b[i]=x.charCodeAt(i);
  return new TextDecoder().decode(b); };
function shareURL(){

let SHARED_IN=false;

/* ── 편집 오버레이 ──
   S.edits 구조: { "dayN|t|title": {t,title,note,warn,cost} | "__del" }
   추가 항목:    { "dayN|__add_N": {t,title,note,warn,cost,tag} }
   S.cEdits:    { "prefix:group:__add_N": [text,sub] | "__del" } */
function applyEdits(dayN, items){
  const result=[];
  items.forEach(it=>{
    if(it.move||it.haul){ result.push(it); return; }
    const k=ikey(dayN,it);
    if(S.edits[k]==='__del') return;
    if(S.edits[k]) result.push({...it,...S.edits[k]});
    else result.push(it);
  });
  /* 추가 항목 */
  const adds=Object.entries(S.edits)
    .filter(([k])=>k.startsWith(dayN+'|__add_'))
    .map(([k,v])=>(typeof v==='object'&&v?{...v,_ekey:k}:null))
    .filter(Boolean)
    .sort((a,b)=>(a.t||'').localeCompare(b.t||''));
  result.push(...adds);
  /* 시간 순 정렬 (non-move, non-haul) */
  return result;
}
function applyCEdits(data, prefix){
  const result=[];
  data.forEach(([g,rows])=>{
    const newRows=[];
    rows.forEach((r,i)=>{
      const id=`${prefix}:${g}:${i}`;
      if(S.cEdits[id]==='__del') return;
      if(S.cEdits[id]) newRows.push(S.cEdits[id]);
      else newRows.push(r);
    });
    /* 추가 항목 */
    const adds=Object.entries(S.cEdits)
      .filter(([k])=>k.startsWith(`${prefix}:${g}:__add_`))
      .map(([,v])=>v).filter(Array.isArray);
    newRows.push(...adds);
    result.push([g,newRows]);
  });
  return result;
}
function makeAddKey(dayN){ return dayN+'|__add_'+Date.now(); }
function makeCAddKey(prefix,group){ return `${prefix}:${group}:__add_${Date.now()}`; }
function applyShare(){
  const m=/[#&]s=([^&]+)/.exec(location.hash); if(!m) return;
  try{ const d=JSON.parse(b64d(m[1]));
    if(d.o) S.o={...S.o,...d.o};
    if(d.m) S.m={...S.m,...d.m};
    if(d.pay) S.pay={...S.pay,...d.pay};
    if(d.gln) S.gln={...S.gln,...d.gln};
    if(d.ck) S.ck={...S.ck,...d.ck};
    SHARED_IN=true; save();
    history.replaceState(null,'',location.pathname);
  }catch(e){}
}

  _items.forEach(it=>{
    if(it.haul){ plan+=it.haul.cost||0; pend+=it.haul.cost||0; return; }
    if(it.move){ const c=moveCost(it.move); plan+=c; pend+=c; return; }
    const c=it.cost||0, k=ikey(d.n,it);
    plan+=c;
    const sp=S.spend[k];
    if(sp!=null&&sp!==''){ real+=Number(sp)+pend; hasReal=true; }
    else if(S.done[k]){ real+=c+pend; hasReal=true; }
    pend=0;
  });
  return {plan,real,hasReal};
}
function dayCost(d){ return daySplit(d).plan; }
function totals(){
  const D=DAYS(); let plan=0,real=0;
  D.forEach(d=>{const s=daySplit(d); plan+=s.plan; real+=s.real;});
  return {plan,real,left:plan-real,over:Math.max(0,real-plan)};
}

/* ══════ 시간 · 진행 상태 ══════ */
const TRIP=[8,9,10,11,12], DOW={1:'목',2:'금',3:'토',4:'일',5:'월'};
function itemTime(n,t){
  const m=/^(\d{1,2}):(\d{2})$/.exec(t||''); if(!m) return null;
  return new Date(2026,9,7+n,+m[1],+m[2]);
}
function todayIndex(){
  const now=new Date();
  if(now.getFullYear()!==2026||now.getMonth()!==9) return 0;
  const i=TRIP.indexOf(now.getDate()); return i<0?0:i+1;
}
function currentItem(){
  const tn=todayIndex(); if(!tn) return null;
  const d=DAYS().find(x=>x.n===tn); if(!d) return null;
  const now=new Date();
  const timed=d.items.filter(it=>!it.move&&!it.haul&&itemTime(tn,it.t));
  for(let i=0;i<timed.length;i++){
    const st=itemTime(tn,timed[i].t);
    const nx=timed[i+1]?itemTime(tn,timed[i+1].t):new Date(2026,9,7+tn,23,59);
    if(now>=st&&now<nx) return {it:timed[i],dayN:tn};
  }
  return null;
}
function currentKey(){ const c=currentItem(); return c?ikey(c.dayN,c.it):null; }
function statusOf(dayN,it){
  const k=ikey(dayN,it);
  if(S.done[k]) return 'done';
  const tn=todayIndex(); if(!tn) return 'future';
  if(dayN<tn) return 'past';
  if(dayN>tn) return 'future';
  if(k===currentKey()) return 'now';
  const st=itemTime(dayN,it.t);
  return (st&&new Date()>st)?'past':'future';
}
const clockStr = () => { const n=new Date();
  return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); };
const minsText = m => m<60 ? `${m}분 후` : `${Math.floor(m/60)}시간 ${m%60}분 후`;

/* ══════ 경고 등급 ══════ */
function alertLevel(t){
  if(/임산부|제외|금지|익은|익힌|생치즈|세척수|계단|어지러|무리|주의|위험/.test(t)) return 'danger';
  if(/예약|노쇼|환불|필수|고지|미리|요청|적으세요|알리|확인/.test(t)) return 'book';
  return 'note';
}
const AL_LABEL={danger:'주의',book:'예약',note:'메모'}, AL_ICON={danger:'⚠',book:'✎',note:'·'};
function tagClass(t){
  if(t==='휴식') return 'rest';
  if(t==='마사지'||t==='야시장') return 'lamp';
  if(t==='비행'||t==='출발') return 'dark';
  return '';
}

/* ══════ 다음 일정 ══════ */
function nextUp(){
  const tn=todayIndex(); if(!tn) return null;
  const d=DAYS().find(x=>x.n===tn); if(!d) return null;
  const now=new Date();
  for(let i=0;i<d.items.length;i++){
    const it=d.items[i];
    if(it.move||it.haul) continue;
    const st=itemTime(tn,it.t);
    if(!st||st<=now||S.done[ikey(tn,it)]) continue;
    let mv=null,haul=null;
    for(let j=i-1;j>=0;j--){
      if(d.items[j].move){ mv=d.items[j].move; break; }
      if(d.items[j].haul){ haul=d.items[j].haul; break; }
      break;
    }
    return {it,mv,haul,mins:Math.max(0,Math.round((st-now)/60000)),dayN:tn};
  }
  return null;
}
function dayProgress(d){
  const ks=d.items.filter(it=>!it.move&&!it.haul);
  const done=ks.filter(it=>S.done[ikey(d.n,it)]).length;
  return {done,total:ks.length,pct:ks.length?done/ks.length:0};
}

let _map=null,_mapKey='';
function killMap(){ if(_map){ try{_map.remove();}catch(e){} _map=null; _mapKey=''; } }
function mapCard(keys){
  const pts=keys.map(k=>({k,...P[k]}));
  const real=true;
  return `<div class="mapcard"><h4>오늘 동선</h4>
    <p class="cap">번호는 위 일정의 번호와 같습니다. 핀을 누르면 주소와 구글맵 링크가 나옵니다.</p>
        <div class="leafwrap" id="leaf"></div>
    <div class="legend">${pts.map((p,i)=>`<span><i>${i+1}</i>${esc(p.n)}</span>`).join('')}</div>
    <p class="maphint">지도 타일은 인터넷이 있어야 보입니다. 안 뜨면 구글맵 링크를 이용하세요.</p>
  </div>`;
}
function initLeaf(keys){
  if(typeof L==='undefined') return;
  const el=document.getElementById('leaf'); if(!el) return;
  const sig=keys.join(',')+'|'+S.focus;
  if(_map&&_mapKey===sig&&el.contains(_map.getContainer())) return;
  killMap(); _mapKey=sig;
  const pts=keys.map(k=>({k,...P[k]})), ll=pts.map(p=>[p.lat,p.lng]);
  _map=L.map(el,{scrollWheelZoom:false,zoomControl:true,preferCanvas:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(_map);
  if(ll.length>1) L.polyline(ll,{color:'#1B6A61',weight:2.5,dashArray:'6 5',opacity:.9}).addTo(_map);
  pts.forEach((p,i)=>L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="pinmark">${i+1}</div>`,iconSize:[25,25],iconAnchor:[12,12]})})
    .addTo(_map).bindPopup(`<b>${esc(p.n)}</b><br>${esc(p.a)}<br><a href="${gmap(p.k)}" target="_blank" rel="noopener">구글맵에서 열기</a>`));
  _map.fitBounds(L.latLngBounds(ll).pad(0.28));
  setTimeout(()=>{ try{_map.invalidateSize();}catch(e){} },150);
}

function openModal(html){ 
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal-bg';
  bg.innerHTML='<div class="modal">'+html+'</div>';
  document.body.appendChild(bg);
  const inp=bg.querySelector('input,textarea');if(inp)setTimeout(()=>inp.focus(),80);
}
function closeModal(){ const el=document.getElementById('modal-bg');if(el)el.remove(); }

function editModal(k, dayN){
  /* 현재 값 = edits 우선, 없으면 원본 */
  const d=DAYS().find(x=>x.n===+dayN);
  const orig=d&&d.items.find(i=>!i.move&&!i.haul&&ikey(+dayN,i)===k)||{};
  const cur=S.edits[k]&&S.edits[k]!=='__del'?{...orig,...S.edits[k]}:orig;
  openModal(`<h3>항목 수정</h3>
    <div class="field"><label>시각</label><input id="e-t" value="${esc(cur.t||'')}" placeholder="예: 14:30"></div>
    <div class="field"><label>제목</label><input id="e-title" value="${esc(cur.title||'')}"></div>
    <div class="field"><label>설명</label><textarea id="e-note">${esc(cur.note||'')}</textarea></div>
    <div class="field"><label>주의사항</label><textarea id="e-warn">${esc(cur.warn||'')}</textarea></div>
    <div class="field"><label>예상 비용 (천동)</label><input id="e-cost" type="number" value="${cur.cost||''}"></div>
    <div class="modal-acts">
      <button class="m-cancel" data-mact="close">취소</button>
      <button class="m-save" data-mact="save-edit" data-ekey="${esc(k)}" data-dayn="${dayN}">저장</button>
    </div>`);
}

function saveEdit(k, dayN){
  const t=document.getElementById('e-t').value.trim();
  const title=document.getElementById('e-title').value.trim();
  const note=document.getElementById('e-note').value.trim();
  const warn=document.getElementById('e-warn').value.trim();
  const cost=document.getElementById('e-cost').value.trim();
  S.edits[k]={...(t?{t}:{}),title,note,warn,...(cost?{cost:+cost}:{})};
  closeModal(); save(); soft(renderPlan);
}
function saveAdd(dayN){
  const t=document.getElementById('e-t').value.trim();
  const title=document.getElementById('e-title').value.trim();
  if(!title){ alert('제목은 필수입니다.'); return; }
  const note=document.getElementById('e-note').value.trim();
  const warn=document.getElementById('e-warn').value.trim();
  const cost=document.getElementById('e-cost').value.trim();
  const newKey=makeAddKey(+dayN);
  S.edits[newKey]={t,title,note,warn,...(cost?{cost:+cost}:{})};
  closeModal(); save(); soft(renderPlan);
}
function saveCEdit(id){
  const text=document.getElementById('ce-text').value.trim();
  const sub=document.getElementById('ce-sub').value.trim();
  if(!text){ alert('내용은 필수입니다.'); return; }
  S.cEdits[id]=[text,sub];
  closeModal(); save(); soft(S.tab==='prep'?renderPrep:renderPrep);
}
function saveCAdd(prefix, group){
  const text=document.getElementById('ce-text').value.trim();

}

function renderMoney(){
  const T=totals(), pct=T.plan?Math.min(100,Math.round(T.real/T.plan*100)):0;
  let h=`<div class="sec"><h3>예산</h3>
    <p class="lead">예상은 2인 기준 추정치입니다. 쓰고 나서 실사용 금액을 넣으면 남은 예산이 다시 계산됩니다.</p>
    <div class="bigprog">
      <div class="row"><span class="n">${fmtW(Math.abs(T.left))}<i> ${T.left<0?'초과':'남음'}</i></span>
        <span class="pct ${T.over?'over':''}">${pct}% 사용</span></div>
      <div class="bar ${T.over?'over':'amber'}"><i style="width:${pct}%"></i></div>
      <div class="split"><span>실사용 ${fmtW(T.real)}</span><span>전체 예상 ${fmtW(T.plan)} · ${fmtK(T.plan)}</span></div>
    </div>`;
  DAYS().forEach(d=>{
    const s=daySplit(d);
    const rows=d.items.filter(it=>!it.move&&!it.haul&&it.cost);
    h+=`<div class="grouphead"><h4>${d.date} ${d.dow} · ${esc(d.title)}</h4>
      <span class="gn">${fmtW(s.plan)}${s.hasReal?` → ${fmtW(s.real)}`:''}</span></div><div class="list">`;
    rows.forEach(it=>{
      const k=ikey(d.n,it), sp=S.spend[k];
      const diff=(sp!=null&&sp!=='')?Number(sp)-it.cost:null;
      h+=`<div class="rowx">
        <span class="txt"><b>${esc(it.title)}</b><em>예상 ${fmtW(it.cost)} · ${fmtK(it.cost)}${
          diff!=null?` · <span style="color:${diff>0?'var(--danger)':'var(--sea)'}">${diff===0?'예산대로':fmtK(Math.abs(diff))+(diff>0?' 초과':' 절약')}</span>`:''}</em></span>
        <input type="number" inputmode="numeric" style="width:96px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;text-align:right;min-height:42px"
          placeholder="${it.cost}" value="${sp??''}" data-spend="${esc(k)}">
      </div>`;
    });
    if(!rows.length) h+=`<div class="rowx"><span class="txt" style="color:var(--faint)">비용 항목 없음</span></div>`;
    h+=`</div>`;
  });
  h+=`<div class="paynote sea">

function updateDock(){

  document.getElementById('bDay').textContent = S.tab==='plan' ? fmtW(dayCost(d)) : '–';
  const u=document.getElementById('bUsed');
  u.textContent=fmtW(T.real); u.className=T.over?'over':'';
  document.getElementById('bAll').textContent=fmtW(T.plan);
  document.getElementById('bBar').style.width=(T.plan?Math.min(100,Math.round(T.real/T.plan*100)):0)+'%';
  document.getElementById('bBarWrap').className='bar'+(T.over?' over':'');
}
function render(){
  if(S.focus&&!['home','plan','sos'].includes(S.tab)) S.tab='home';
  if(S.focus){ const t=todayIndex(); if(t) S.day=t; }
  if(S.tab!=='plan') killMap();
  renderNav(); renderStamp(); renderDaybar();

function refreshStop(k){
  const el=document.querySelector('.stop[data-k="'+k+'"]'); if(!el) return;
  const dayN=+k.split('|')[0], d=DAYS().find(x=>x.n===dayN); if(!d) return;
  const it=d.items.find(x=>!x.move&&!x.haul&&ikey(dayN,x)===k); if(!it) return;
  el.outerHTML=stopHTML(dayN,it,+el.dataset.num||0);
}

  if(e.target.closest('#editbtn')){
    document.body.classList.toggle('edit-on');
    document.getElementById('editbtn').setAttribute('aria-pressed',document.body.classList.contains('edit-on'));
    return;
  }
  if(e.target.closest('#focusbtn')){ S.focus=!S.focus; save(); render(); scrollTo(0,0); return; }

  const tb=e.target.closest('[data-tab]');
  if(tb){ S.tab=tb.dataset.tab; if(tb.dataset.seg) S.seg=tb.dataset.seg; render(); scrollTo(0,0); return; }
  const sg=e.target.closest('[data-seg]');
  if(sg){ S.seg=sg.dataset.seg; render(); scrollTo(0,0); return; }
  const chip=e.target.closest('.chip');
  if(chip){ S.day=+chip.dataset.day; render(); scrollTo(0,0); return; }

  const mm=e.target.closest('[data-mapmode]');
  if(mm){ S.mapmode=mm.dataset.mapmode; killMap(); save(); soft(renderPlan); return; }

  const op=e.target.closest('[data-open]');
  if(op&&!op.disabled){
    const k=op.dataset.open; S.open[k]=!S.open[k];
    const card=op.closest('.card');
    op.setAttribute('aria-expanded',S.open[k]);
    const old=card.querySelector('.body'); if(old) old.remove();
    if(S.open[k]){
      const dayN=+k.split('|')[0], d=DAYS().find(x=>x.n===dayN);
      const it=d&&d.items.find(x=>!x.move&&!x.haul&&ikey(dayN,x)===k);
      if(it) card.insertAdjacentHTML('beforeend',bodyHTML(dayN,it));
    }
    return;
  }
  const pb=e.target.closest('[data-pay]');
  if(pb){
    S.pay[pb.dataset.pay]=pb.dataset.payv; save();
    if(S.tab==='money'){ soft(renderMoney); }
    else{
      const grp=pb.closest('.paybtns');
      if(grp) grp.querySelectorAll('[data-pay]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.payv===pb.dataset.payv));
      const st=pb.closest('.stop'); if(st) refreshStop(st.dataset.k);
    }
    return;
  }
  const gb=e.target.closest('[data-gln]');
  if(gb){
    S.gln[gb.dataset.gln]=gb.dataset.glnv; save();
    if(S.tab==='money'){ soft(renderMoney); }
    else{
      const grp=gb.closest('.paybtns');
      if(grp) grp.querySelectorAll('[data-gln]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.glnv===gb.dataset.glnv));
      const st=gb.closest('.stop'); if(st) refreshStop(st.dataset.k);
    }
    return;
  }
  const dn=e.target.closest('[data-done]');
  if(dn){ const k=dn.dataset.done; S.done[k]=!S.done[k]; save(); refreshStop(k); updateDock(); renderDaybar(); return; }

  const mv=e.target.closest('[data-mv]');
  if(mv){
    S.m[mv.dataset.mv]=mv.dataset.pick; save();
    (mv.closest('.opts')||mv.parentElement).querySelectorAll('[data-mv]').forEach(b=>
      b.setAttribute('aria-pressed', b.dataset.pick===mv.dataset.pick));
    updateDock(); return;
  }
  const opt=e.target.closest('[data-opt]');
  if(opt){
    let v=opt.dataset.val;
    if(v==='true')v=true; else if(v==='false')v=false; else if(opt.dataset.opt==='last')v=+v;
    S.o[opt.dataset.opt]=v; invalidate(); save(); soft(render); return;
  }
  /* 모달 배경 클릭 닫기 */
  if(e.target.id==='modal-bg'){ closeModal(); return; }
  /* 모달 액션 */
  const ma=e.target.closest('[data-mact]');
  if(ma){
    const act=ma.dataset.mact;
    if(act==='close'){ closeModal(); return; }
    if(act==='save-edit'){ saveEdit(ma.dataset.ekey,ma.dataset.dayn); return; }
    if(act==='save-add'){ saveAdd(ma.dataset.dayn); return; }
    if(act==='save-cedit'){ saveCEdit(ma.dataset.eid); return; }
    if(act==='save-cadd'){ saveCAdd(ma.dataset.prefix,ma.dataset.group); return; }
  }
  /* 편집 바 */
  const eb=e.target.closest('[data-ebar]');
  if(eb){
    const {ebar,ekey,dayn}=eb.dataset;
    if(ebar==='edit'){ editModal(ekey,dayn); return; }
    if(ebar==='del'){ S.edits[ekey]='__del'; save(); soft(renderPlan); return; }
    if(ebar==='restore'){ delete S.edits[ekey]; save(); soft(renderPlan); return; }
    if(ebar==='add'){ addModal(+dayn); return; }
    if(ebar==='c-edit'){ const d=eb.dataset; cEditModal(d.eid,d.prefix,d.ctext,d.csub); return; }
    if(ebar==='c-del'){
      const id=eb.dataset.eid;
      if(id.includes('__add_')) delete S.cEdits[id];
      else S.cEdits[id]='__del';
      save(); soft(renderPrep); return;
    }
    if(ebar==='c-add'){ cAddModal(eb.dataset.prefix,eb.dataset.group); return; }
    if(ebar==='c-reset'){ const p=eb.dataset.prefix; Object.keys(S.cEdits).filter(k=>k.startsWith(p+':')).forEach(k=>delete S.cEdits[k]); save(); soft(renderPrep); return; }
  }
  const sb=e.target.closest('[data-share]');
  if(sb){
    const url=shareURL(), out=document.getElementById('shareOut');
    const done=ok=>{ if(out) out.textContent = ok
      ? '복사했습니다 ('+url.length+'자). 카톡으로 보내세요.'
      : '자동 복사가 안 됩니다. 이 주소를 길게 눌러 복사하세요 → '+url; };
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(url).then(()=>done(true)).catch(()=>done(false));
    else done(false);
    return;
  }
  const sr=e.target.closest('[data-sort]');
  if(sr){ S.sortDone=!S.sortDone; save(); soft(renderPrep); return; }
  const ck=e.target.closest('[data-ck]');
  if(ck){
    const id=ck.dataset.ck; S.ck[id]=!S.ck[id]; save();
    ck.setAttribute('aria-pressed',S.ck[id]);
    setTimeout(()=>soft(renderPrep),S.sortDone?260:0);
    return;
  }
});
/* 입력 — 저장은 조용히, 화면 갱신은 포커스 해제 후 */
document.addEventListener('input',e=>{
  const sp=e.target.closest('[data-spend]');
  if(sp){ const v=sp.value.trim(); if(v==='') delete S.spend[sp.dataset.spend]; else S.spend[sp.dataset.spend]=Number(v); save(); updateDock(); return; }
  const em=e.target.closest('[data-em]');
  if(em){ S.em[em.dataset.em]=em.value; save(); }
});
document.addEventListener('change',e=>{
  const sp=e.target.closest('[data-spend]');
  if(sp){ if(S.tab==='money') soft(renderMoney); else refreshStop(sp.dataset.spend); updateDock(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') hideDriver(); });

/* ══════ 시계 ══════ */
let _lastNow=null;
function tick(){
  const t=clockStr();
  ['clock','clock2'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=t; });
  const k=currentKey();
  if(S.tab==='home'){ soft(renderHome); _lastNow=k; return; }
  if(k!==_lastNow){ _lastNow=k; if(S.tab==='plan') soft(renderPlan); }
}
setInterval(tick,30000);

load().then(()=>{
  const tn=todayIndex();
  if(tn){ S.day=tn; } else { S.day=1; }
  _lastNow=currentKey();
  render();
});
</script>
</body>
</html>
